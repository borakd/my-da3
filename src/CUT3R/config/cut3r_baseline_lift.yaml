model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False))"
# Load and freeze the pretrained encoder, nothing else.
# This mimics the behavior of having a pretrained encoder, such as in the case of the DA3 encder substitution,
# whilst enabling me to verify what CUT3R outputs look like after overfitting to a single robomimic scene.
pretrained: /scratch/bdursun25/cuteanything/my-da3/src/CUT3R/src/cut3r_512_dpt_4_64.pth
load_only_encoder: True
long_context: False
fixed_length: True
resume: null
benchmark: False
num_views : 2
num_test_views : 2
n_corres_train: 0
n_corres_test: 0

train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
test_criterion: Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)

resolution: [[512, 512]]

# Just lift task demo 0
allow_repeat: True
dataset1: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="train", ROOT="/scratch/bdursun25/cuteanything/scenes/robomimic/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_views}, n_corres=${n_corres_train})'

train_dataset: 118 @ ${dataset1}
test_dataset: 118 @ ${dataset1}

seed: 0
batch_size: 4
accum_iter: 1
gradient_checkpointing: True
epochs: 500
start_epoch: 0
weight_decay: 0.0
lr: 5e-5
min_lr: 1e-6
warmup_epochs: 5
amp: 1

num_workers: 4
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 5
save_freq: 50
keep_freq: 50
print_freq: 1
print_img_freq: 1
num_imgs_vis: 4
save_dir: '/scratch/bdursun25/cuteanything/checkpoints/cut3r_baselines'
exp_name: 'cut3r_overfit_lift_v0.1'
task: 'cut3r'
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}