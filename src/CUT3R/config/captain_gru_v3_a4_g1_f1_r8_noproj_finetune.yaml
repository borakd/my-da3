# ============================================================================
# captain_gru_v3_a4_g1_f1_r8_noproj_finetune -- 8 nodes x 4 = 32 GPUs, peak lr 1e-5
# FULL-DATASET finetune: A4 x G1 x F1-RAW x R8 -- two-frame image features,
# NO projection, 8x iterative GRU, AUX-LOSS-ONLY gradient (no e2e path).
# ----------------------------------------------------------------------------
# The R8 sibling of captain_gru_v3_a4_g1_f1_noproj_finetune.yaml: body verified
# byte-identical to that arm except pose_gru_iters: 8, pose_gru_iter_gamma:
# 0.8, exp_name, and this header. NB per the aux-scale note below that
# R8-vs-R1 comparison is NOT single-variable.
#
# LEVERS:
#   A4  pose_gru_input='pose_delta' (14-d: P(x-1) + inv(P(x-2))@P(x-1)),
#       pose_gru_mode='residual' (ZERO-INIT head, so an untrained module
#       reproduces plain feed_prev_pred bit-for-bit).
#   G1  pose_gru_bptt=True, pose_gru_e2e=False. The GRU is trained by the aux
#       PoseGRULoss ALONE, with the hidden's tape kept across the views of one
#       TBPTT chunk; the pose entering the ray build is DETACHED, so the main
#       reconstruction loss NEVER reaches the GRU. Forward math is IDENTICAL
#       across G0/G1/G3 -- G is purely a gradient-routing lever.
#   F1-RAW  pose_gru_img_feat='input', frames=2, proj=False: the 2x1024-D
#       LayerNormed pooled PRE-ray image-encoder features of views t and t-1
#       enter the cell RAW -- no zero-init Linear(2048 -> 32) bottleneck; cell
#       input width 14+2048=2062. pose_gru_img_feat_dim is IGNORED when
#       proj=False. Init-equivalence is weaker than the projected arms (no
#       zero gate on the image columns); only the zero-init HEAD makes the
#       OUTPUT identical to F-off at init, and under G1 the ONLY loss that can
#       unlock the head is the aux PoseGRULoss. Do NOT run the IMG_FEAT
#       falsifiers before the head unlocks. Full F1-RAW documentation:
#       captain_gru_v3_a4_g3_f1_noproj_finetune.yaml.
#   R8  pose_gru_iters=8, pose_gru_iter_detach=True, pose_gru_iter_gamma=0.8.
#       EIGHT back-to-back GRUCell calls per view.
#
# THE R LEVER, EXACTLY (see captain_gru_v3_a4_g3_f1_r8_finetune.yaml for the
# annotated loop):
#   est = P(x-1); for k in range(8): out_k, hidden = cell(cat([est, delta]),
#   hidden, img_feat); est = out_k.detach() between iterates; the ray map is
#   built from out_7 ONLY (the FINAL iterate).
#   * ZERO new parameters -- same GRUCell/head re-entered 8 times, so this
#     checkpoint has exactly the weight shapes of its R1 twin
#     captain_gru_v3_a4_g1_f1_noproj_finetune (iters lives in ckpt args, not
#     shapes; POSE_GRU_FORCE_ITERS can re-probe any checkpoint at another N).
#   * delta_static and the 2048-D img_feat_vec are computed ONCE per view and
#     re-injected unchanged every iterate -- static per-view context, RAFT
#     style. Only the POSE slice of the input evolves. Under F1-RAW the
#     iterates refine the pose against a fixed raw appearance context.
#   * hidden is threaded THROUGH the iterates, never detached inside a view;
#     detaching happens only at the view boundary (the G lever).
#   * iter_detach=True cuts the tape on the running pose estimate between
#     iterates (RAFT's coords1.detach()), keeping the 8-deep unroll stable.
#   * The whole loop runs fp32 under torch.autocast(enabled=False).
#   * G1 x R8 interplay: with e2e OFF, gradient reaches the cell only from the
#     gamma-weighted aux sequence loss -- each iterate is supervised directly
#     on the train side, and later iterates also reach earlier ones through
#     the hidden (within a view) and through bptt (across a chunk's views).
#
# !! R8 MULTIPLIES THE AUX LOSS BY 4.1611x -- A SECOND VARIABLE vs R1 !!
# PoseGRULoss weights iterate k by gamma**(N-1-k), final iterate 1.0; at
# gamma=0.8, N=8 the weights sum to 4.1611 (vs 1.0 at N=1). With
# pose_gru_loss_weight=1.0 (kept to match every other R arm on disk) the aux
# term carries 4.1611x the gradient magnitude of the R1 twin. Under G1 this
# bites HARDER than in the G3 r8 arms: the aux loss is the ONLY gradient the
# GRU gets, so the R8-vs-R1 G1 comparison changes iterate count AND total
# GRU gradient scale together. To isolate the iterate count alone:
#     ... pose_gru_loss_weight=0.2403          # = 1/4.1611, matches R1's scale
#
# TRAIN != TEST CRITERION (unlike the R1 arms). gamma>0 makes PoseGRULoss
# report as 'PoseGRULoss(iter_gamma=0.8)' on the train side and 'PoseGRULoss()'
# on the test side (test is deliberately FINAL-ITERATE ONLY -- the deployed
# quantity is the pose that drives the ray build). Train/test loss curves are
# NOT directly comparable to each other in this arm; compare each against the
# same side of another run.
#
# WHAT THIS ARM IS FOR.
#   vs captain_gru_v3_a4_g1_f1_noproj_finetune (R1, same A/G/F): prices the
#      iterate re-feed at G1/F1-RAW (with the aux-scale caveat above).
#   NO G3 twin exists for pooled-noproj R8 -- the nearest R8 noproj arms are
#      captain_gru_v3_a4_g3_f1{r,d}_r8_noproj_finetune (resnet18/dinov2
#      sources, G3): TWO levers away (G and F-source); do not read a
#      single-lever effect out of that comparison.
#
# CHECKPOINT COMPATIBILITY. Identical shapes to the R1 noproj twins (G and R
# are invisible in weights): img_norm present, img_proj absent, weight_ih 2062
# wide. Shape-incompatible with F-off, projected-F and f0_noproj checkpoints;
# the loader HARD-FAILS on any pose_gru mismatch. NO WARM START EXISTS for the
# noproj arms -- trains from base CUT3R like every other v3 arm.
#
# ddp_grad_sync: false (explicit) -- the historical baseline behavior; kept
# false so this arm is comparable to the rest of the finetune family.
#
# Falsifiers (keep_freq snapshot only, NOT before the head unlocks):
#   PREV_PRED_RAY_SHUFFLE=1                                -- pose-feedback channel
#   POSE_GRU_IMG_FEAT_SHUFFLE=1 / POSE_GRU_IMG_FEAT_ZERO=1 -- THE F LEVER
#   POSE_GRU_HIDDEN_SHUFFLE=1 / POSE_GRU_HIDDEN_ZERO=1     -- recurrence
#   POSE_GRU_FORCE_ITERS={1,2,4,8,16}                      -- anytime-N probe;
#     this arm TRAINED the re-feed, so the N-vs-accuracy curve is meaningful
#     in-distribution at N<=8.
#
# Run (32 GPUs; the GPU count comes from --nodes, NOT from this file):
#   cd /gpfs/home/koc/koc821022/vggt_features && \
#   sbatch --nodes=8 --job-name=gru_a4g1f1r8np_ft \
#          train_gru_v3_finetune_64node.sbatch captain_gru_v3_a4_g1_f1_r8_noproj_finetune
# NB the launcher's #SBATCH default is --nodes=64; --nodes=8 on the command
# line is REQUIRED.
# ============================================================================
model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False))"
# Base CUT3R weights, NOT a warm start from a trained GRU -- identical to every
# other v3 grid arm, which is what keeps the comparison clean.
pretrained: /gpfs/home/koc/koc821022/vggt_features/src/CUT3R/src/cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: True
fixed_length: False
resume: null
benchmark: False
num_views : 64
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

# PoseGRU term weight, interpolated into both criterion strings below.
# See the "R8 MULTIPLIES THE AUX LOSS" note in the header before changing this:
# at iters=8/gamma=0.8 the effective multiplier on the aux term is 4.1611.
pose_gru_loss_weight: 1.0

# R lever supervision: RAFT sequence loss over the 8 iterates, w_k = 0.8^(7-k),
# final iterate weight 1.0. TRAIN side only -- test_criterion below is
# deliberately final-iterate-only, so the two strings differ in this arm.
pose_gru_iter_gamma: 0.8

train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE) + ${pose_gru_loss_weight}*PoseGRULoss(iter_gamma=${pose_gru_iter_gamma})
# Final-iterate-only on the test side: the deployed quantity is the pose that
# actually drives the ray build, which is iterate 7. Reports as 'PoseGRULoss()'.
# NOTE: best_ckpt_agg selects on the test loss INCLUDING the gru term -- compare
# arms at fixed epochs, or subtract gru_pose_loss_avg from headline losses.
test_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE) + ${pose_gru_loss_weight}*PoseGRULoss()

# Extra diagnostic test criteria, evaluated on the same forward pass as test_criterion.
# Each is logged under <test_prefix>_<name>/... so the total ('<name>/loss') and every
# individual term get their own scalar plots in TensorBoard / W&B.
# Byte-identical to every other 32gpu/1e-5 arm ON PURPOSE: this is the
# run-independent reference metric, and it carries no GRU term.
extra_test_criteria:
  orig: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

resolution: [[320, 192]]

allow_repeat: True

# When True, each sampled batch is a strictly consecutive (interval=1), temporally
# ordered window of `num_views` frames. When False, behaves exactly as before.
force_consecutive_frame_sampling: True

# Closed-loop previous-prediction conditioning: at step x the model builds a ray
# map from the pose it PREDICTED at step x-1 (fed through the pretrained ray-map
# encoder, intrinsics from view x-1) and adds it to view x's encoder tokens
# inside the decode loop. Model-side flag read by train_cut3r_baseline; both
# dataset ray flags MUST stay False (the model asserts this). View 0 gets the
# masked_ray_map_token. The fed-back pose is detached (it is an input, not a
# gradient path; required under TBPTT).
# Falsifier: env PREV_PRED_RAY_SHUFFLE=1 batch-rolls the fed-back poses.
feed_gt_ray_map: False
feed_prev_gt_ray_map: False
feed_prev_pred: True

# PoseGRU: recurrent filter between the fed-back pose and the ray-map build
# (see PoseGRU in dust3r/model.py). Aux-trained by the PoseGRULoss term against
# the current view's GT pose; hidden resets at view 0.
#   pose_gru_mode / pose_gru_input: A4 -- pose_delta input, residual head.
#   pose_gru_bptt (G1): True; pose_gru_e2e (G2): False -- together G1.
#                   The GRU's output still drives the ray build (forward
#                   identical to G3), but it enters the build DETACHED: only
#                   the aux PoseGRULoss trains the GRU.
#   pose_gru_iters (R lever): 8 here = R ON. Zero new params; the count is
#                   persisted in ckpt args and restored by load_model (it is
#                   invisible in weight shapes); the loader HARD-FAILS on any
#                   pose_gru shape mismatch, so a silent random-GRU eval is
#                   impossible.
#   pose_gru_iter_detach: ACTIVE at iters>1 -- detaches the running pose estimate
#                   between iterates (RAFT discipline). The hidden is NOT
#                   detached inside the view.
#   pose_gru_img_feat (F lever): 'input' = F ON. frames=2 + proj=False = the
#                   F1-RAW arm: the 2x1024-D LayerNormed features of views t
#                   and t-1 enter the cell RAW; cell input width 14+2048=2062.
#   pose_gru_oracle: ABSENT -> 'off'. This is an HONEST arm; the GRU only ever
#                   sees the pose the model itself predicted.
# Falsifiers: PREV_PRED_RAY_SHUFFLE=1 (rolls BOTH pose stashes coherently),
# POSE_GRU_HIDDEN_SHUFFLE=1 (rolls hidden), POSE_GRU_HIDDEN_ZERO=1 (stateless),
# POSE_GRU_IMG_FEAT_SHUFFLE=1 / POSE_GRU_IMG_FEAT_ZERO=1 (F-lever falsifiers),
# POSE_GRU_FORCE_ITERS=<n> (anytime-N probe).
pose_gru: True
pose_gru_mode: residual
pose_gru_input: pose_delta
pose_gru_hidden_dim: 128
pose_gru_lr_scale: 100.0           # x lr -> GRU group peaks at 1e-3; see the
                                   # f1_finetune header. img_norm rides in the
                                   # scaled group too (collected by identity).
pose_gru_bptt: True                # G1: within-chunk BPTT ON
pose_gru_e2e: False                # G1: e2e OFF -- main loss never reaches the GRU
pose_gru_iters: 8                  # R ON -- 8 back-to-back cell calls per view
pose_gru_iter_detach: True         # ACTIVE: detach running pose between iterates
pose_gru_img_feat: input           # F ON
pose_gru_img_feat_dim: 32          # IGNORED while proj=False (appended width is
                                   #   encoder x frames); kept so flipping proj
                                   #   back on is a one-word change
pose_gru_img_feat_frames: 2        # f1: current view t + previous t-1
pose_gru_img_feat_proj: False      # NO Linear: 2048-D raw  <-- with iters/gamma,
                                   #   the only keys that differ from the R1 twin
                                   #   captain_gru_v3_a4_g1_f1_noproj_finetune

# ddp_grad_sync false = the historical baseline: no cross-rank gradient
# averaging on the TBPTT path (see captain_gru_v3_a4_g3_ddpsync_finetune.yaml).
# Explicit rather than omitted so the choice is visible in the file.
ddp_grad_sync: false

# FULL DROID SPLITS -- 38633 train / 4292 test scenes, per-lab stratified 90/10
# (seed 42). Train adds aug_crop=16 + SeqColorJitter; test stays aug_crop=0 +
# ImgNorm. The ray-map kwargs are OMITTED (DL3DV_Multi defaults both to False,
# which is what the feed_prev_pred arm requires).
#
# The launcher runs build_dataset_symlinks.py --check on the head node BEFORE
# allocating, because dl3dv.py silently SKIPS dangling symlinks (no error, no
# warning) and would train on a short dataset whose truncated scan then gets
# written to the disk cache.
#
# NB: the split="train"/"test" kwarg is INERT -- DL3DV_Multi accepts and discards
# it. Train/test separation comes ENTIRELY from ROOT, so a ROOT typo cannot be
# caught by the split argument.
train_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="train", ROOT="/gpfs/scratch/etur59/koc821022/pointworld_droid_splits/train/dl3dv_multi", aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling})'
test_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="test", ROOT="/gpfs/scratch/etur59/koc821022/pointworld_droid_splits/test/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_test_views}, n_corres=${n_corres_test}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling})'

train_dataset: 38633 @ ${train_data}
test_dataset: 4292 @ ${test_data}

seed: 0
# ===== MULTINODE (8 nodes x 4 GPUs = 32 processes) =====
# Global batch per optimizer step = batch_size * accum_iter * num_gpus
#   32 GPUs here = 4 * 1 * 32 = 128   (301 optimizer steps/epoch)
# accum_iter stays 1 so the per-GPU batch_size=4 sampler micro-batch grouping is
# unchanged. Everything else (lr schedule, epochs, dataset epoch-size) is
# GPU-count-independent, so a 32- and a 64-GPU run of this config would differ
# ONLY in global batch.
batch_size: 4
accum_iter: 1
gradient_checkpointing: True
epochs: 50
start_epoch: 0
weight_decay: 0.05
lr: 1e-5                 # 10x the 1e-6 GRU-family default -- see f1_finetune header
min_lr: 1e-6             # scaled by the same 10x: cosine shape preserved
warmup_epochs: 0.5
amp: 1

num_workers: 10
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: True
dist_backend: 'nccl'

# Metric logging / checkpointing
log_median: False        # when False, only *_avg metrics are logged (no *_med)
best_ckpt_agg: avg       # save best checkpoint on loss_avg instead of loss_med

eval_freq: 1
save_freq: 1
keep_freq: 10
print_freq: 10
print_img_freq: 1000
num_imgs_vis: 4
# The canonical NEW-runs root since 2026-08-14 (all finetune checkpoints moved
# off /gpfs/projects, which was running out of space; pre-move runs live under
# /gpfs/scratch/etur59/koc821022/checkpoints_projects). sync_nomedia.sh now
# lives at this root and searches it, so W&B porting works out of the box.
save_dir: '/gpfs/scratch/etur59/koc821022/checkpoints/captain_cut3r_finetune_aug_full'
exp_name: 'captain_gru_v3_a4_g1_f1_r8_noproj_finetune'
task: 'cut3r'
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
