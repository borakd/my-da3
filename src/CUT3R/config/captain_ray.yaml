model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False))"
pretrained: /gpfs/home/koc/koc821022/my-da3/src/CUT3R/src/cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: True
fixed_length: False
resume: null
benchmark: False
num_views : 64
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
# Kept equal to train_criterion to watch overfitting (train vs test on the same loss).
test_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)

# Extra diagnostic test criteria, evaluated on the same forward pass as test_criterion.
# Each is logged under <test_prefix>_<name>/... so the total ('<name>/loss') and every
# individual term get their own scalar plots in TensorBoard / W&B. Add more entries to
# track several criteria at once.
extra_test_criteria:
  orig: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

resolution: [[320, 192]]

allow_repeat: True

# When True, each sampled batch is a strictly consecutive (interval=1), temporally
# ordered window of `num_views` frames. When False, behaves exactly as before.
force_consecutive_frame_sampling: True

# GT-pose oracle: condition every non-reference view on its ground-truth camera
# (pose + intrinsics from the cam npz) via CUT3R's pretrained ray-map encoder.
# View 0 stays image-only (its relative pose is identity). Set False (or override
# on the CLI: feed_gt_ray_map=False) for the unconditioned baseline comparison.
# Falsifier: run with env GT_RAY_MAP_SHUFFLE=1 to feed wrong ray maps — metrics
# must degrade vs. the correct-ray run, else the model is ignoring the rays.
feed_gt_ray_map: True

# One-step-lagged variant: view x is conditioned on view x-1's GT camera instead
# of its own (view x-1's entire ray map, shifted in the loader). Mutually
# exclusive with feed_gt_ray_map. See config captain_ray_prev_gt.
feed_prev_gt_ray_map: False

# Closed-loop variant: view x is conditioned on the pose the model PREDICTED at
# step x-1, built into a ray map inside the decode loop (model-side flag, not a
# dataset flag — both dataset ray flags must be False). Falsifier: env
# PREV_PRED_RAY_SHUFFLE=1. See config captain_ray_prev_pred.
feed_prev_pred: False

# ONE TEST SCENE -- a single 672-frame DROID wrist episode, NOT the full
# dataset. (The block previously labelled '# FULL DATASET' here was
# byte-identical to this one; the duplicate has been removed.)
train_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="train", ROOT="/frozen/avg/bora_data/droid_datasets/training_data/pointworld_droid_wrist_test/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_views}, n_corres=${n_corres_train}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling}, feed_gt_ray_map=${feed_gt_ray_map}, feed_prev_gt_ray_map=${feed_prev_gt_ray_map})'
test_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="test", ROOT="/frozen/avg/bora_data/droid_datasets/training_data/pointworld_droid_wrist_test/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_test_views}, n_corres=${n_corres_test}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling}, feed_gt_ray_map=${feed_gt_ray_map}, feed_prev_gt_ray_map=${feed_prev_gt_ray_map})'

# (38633 / 4292 are the FULL-split scene counts -- not used by this arm.)
train_dataset: 672 @ ${train_data}
test_dataset: 672 @ ${test_data}

