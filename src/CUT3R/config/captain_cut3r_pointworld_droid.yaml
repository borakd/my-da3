# Design B (use_gt_pose): identical to cut3r_pointworld_droid.yaml except the model is
# built with use_gt_pose=True, so the pose-retriever memory is teacher-forced with the
# GT-encoded camera pose (inv(gt_0) @ gt_i) instead of the model's predicted pose, on
# every forward pass (train + inference). The new PoseEncoder params are absent from the
# pretrained checkpoint and load at random init (strict=False) -> trained during finetune.
# exp_name is distinct so checkpoints/logs do not collide with the baseline.
model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, use_gt_pose=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False))"
pretrained: /scratch/bdursun25/cuteanything/my-da3/src/CUT3R/src/cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: False
fixed_length: False
resume: null
benchmark: False
num_views : 64
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
# Kept equal to train_criterion to watch overfitting (train vs test on the same loss).
test_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)

# Extra diagnostic test criteria, evaluated on the same forward pass as test_criterion.
# Each is logged under <test_prefix>_<name>/... so the total ('<name>/loss') and every
# individual term get their own scalar plots in TensorBoard / W&B. Add more entries to
# track several criteria at once.
extra_test_criteria:
  orig: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

resolution: [[320, 192]]

allow_repeat: True

# When True, each sampled batch is a strictly consecutive (interval=1), temporally
# ordered window of `num_views` frames. When False, behaves exactly as before.
force_consecutive_frame_sampling: True

# Symlinked train/test splits under scenes/pointworld_droid_splits. ROOT must point at the
# `dl3dv_multi` level (the loader walks ROOT/wrist/<scene>/dense and follows symlinks).
train_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="train", ROOT="/scratch/bdursun25/cuteanything/scenes/pointworld_droid_splits/train/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_views}, n_corres=${n_corres_train}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling})'
test_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="test", ROOT="/scratch/bdursun25/cuteanything/scenes/pointworld_droid_splits/test/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_test_views}, n_corres=${n_corres_test}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling})'

# 38633 4292
train_dataset: 672 @ ${train_data}
test_dataset: 672 @ ${test_data}

seed: 0
batch_size: 4
accum_iter: 4
gradient_checkpointing: True
epochs: 50
start_epoch: 0
weight_decay: 0.05
lr: 1e-6
min_lr: 1e-7
warmup_epochs: 0.5
amp: 1

num_workers: 10
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: True
dist_backend: 'nccl'

# Metric logging / checkpointing
log_median: False        # when False, only *_avg metrics are logged (no *_med)
best_ckpt_agg: avg       # save best checkpoint on loss_avg instead of loss_med

eval_freq: 1
save_freq: 1
keep_freq: 10
print_freq: 10
print_img_freq: 50
num_imgs_vis: 4
save_dir: '/scratch/bdursun25/cuteanything/checkpoints/cut3r_overfit'
exp_name: 'overfit_test_scene_captain'
task: 'cut3r'
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
