# ============================================================================
# cut3r_pointworld_droid_aug_mn5_prevgt_32gpu_lr1e5
# FULL-DATASET finetune: PREVIOUS-frame GT pose conditioning (one-step-lagged oracle)
# ----------------------------------------------------------------------------
# Third arm alongside the two completed/running lr1e5 32-GPU siblings:
#   cut3r_pointworld_droid_aug_mn5_gtray_32gpu_lr1e5     (current-frame GT rays)
#   cut3r_pointworld_droid_aug_mn5_prevpred_32gpu_lr1e5  (prev predicted pose, closed loop)
#
# Built from captain_ray_prev_gt.yaml (single-scene captain arm): the pose-
# conditioning block is copied verbatim from there; EVERYTHING else follows the
# shared full-dataset lr1e5 recipe of the two siblings above (38633/4292 splits,
# aug_crop=16 + SeqColorJitter train / ImgNorm test, 64 views, batch 4,
# 50 epochs, lr 1e-5 / min_lr 1e-6, criteria unchanged -- no PoseGRU term).
#
# CHANGED vs cut3r_pointworld_droid_aug_mn5_gtray_32gpu_lr1e5, and nothing else:
#   feed_gt_ray_map        True  ->  False
#   feed_prev_gt_ray_map   False ->  True
#   exp_name                     ->  cut3r_finetune_aug_full_prevgt_32gpu_lr1e5
#
# This is a 32-GPU arm (global batch 4 x 1 x 32 = 128, 301 steps/epoch).
# GPU count comes from the launcher, not this file:
#   cd /gpfs/home/koc/koc821022/vggt_features && \
#   sbatch --parsable --nodes=8 --job-name=cut3r_prevgt_32gpu_lr1e5 \
#          train_gru_v3_finetune_64node.sbatch cut3r_pointworld_droid_aug_mn5_prevgt_32gpu_lr1e5
# ============================================================================
model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False))"
pretrained: /gpfs/home/koc/koc821022/vggt_features/src/CUT3R/src/cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: True
fixed_length: False
resume: null
benchmark: False
num_views : 64
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)
# Kept equal to train_criterion to watch overfitting (train vs test on the same loss).
test_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis'), alpha=0.2) + RGBLoss(MSE)

# Extra diagnostic test criteria, evaluated on the same forward pass as test_criterion.
# Each is logged under <test_prefix>_<name>/... so the total ('<name>/loss') and every
# individual term get their own scalar plots in TensorBoard / W&B. Add more entries to
# track several criteria at once.
extra_test_criteria:
  orig: "Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=True, sky_loss_value=0) + RGBLoss(L21)"

# ---- pose conditioning -------------------------------------------------------
# ONE-STEP-LAGGED GT-POSE ORACLE (matches captain_ray_prev_gt.yaml). At step x the
# model is conditioned on view x-1's ground-truth camera (its entire ray map --
# pose AND intrinsics -- shifted one step in the loader) via CUT3R's pretrained
# ray-map encoder. View 0 has no predecessor and stays image-only.
# This is a DATASET-side flag: the loader builds and shifts the ray maps, so the
# kwargs must be passed into DL3DV_Multi below. Mutually exclusive with
# feed_gt_ray_map.
# NB safe with aug_crop=16: _crop_resize_if_necessary returns crop-adjusted
# intrinsics (dl3dv.py:322-331) and the ray map is built afterwards from those and
# the post-crop h/w (base_multiview_dataset.py:374), then shifted -- so each
# shifted map is view x-1's true post-crop geometry.
# Falsifier: env GT_RAY_MAP_SHUFFLE=1 corrupts the (shifted) maps -- metrics must
# degrade vs. the correct run, else the model is ignoring the rays.
feed_gt_ray_map: False
feed_prev_gt_ray_map: True
feed_prev_pred: False

resolution: [[320, 192]]

allow_repeat: True

# When True, each sampled batch is a strictly consecutive (interval=1), temporally
# ordered window of `num_views` frames. When False, behaves exactly as before.
force_consecutive_frame_sampling: True

# Native-CUT3R-style augmentation: TRAIN uses aug_crop=16 + transform=SeqColorJitter
# (random scale-crop jitter + temporally-consistent color jitter); TEST stays clean
# (aug_crop=0, transform=ImgNorm), exactly as the upstream stage/dpt_512 configs do it.
#
# Symlinked train/test splits under scenes/pointworld_droid_splits. ROOT must point at the
# `dl3dv_multi` level (the loader walks ROOT/wrist/<scene>/dense and follows symlinks).
#
# ===== FULL DROID SPLITS (38633 train / 4292 test) on MareNostrum5 =====
train_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="train", ROOT="/gpfs/scratch/etur59/koc821022/pointworld_droid_splits/train/dl3dv_multi", aug_crop=16, resolution=${resolution}, transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling}, feed_gt_ray_map=${feed_gt_ray_map}, feed_prev_gt_ray_map=${feed_prev_gt_ray_map})'
test_data: 'DL3DV_Multi(allow_repeat=${allow_repeat}, split="test", ROOT="/gpfs/scratch/etur59/koc821022/pointworld_droid_splits/test/dl3dv_multi", aug_crop=0, resolution=${resolution}, transform=ImgNorm, num_views=${num_test_views}, n_corres=${n_corres_test}, force_consecutive_frame_sampling=${force_consecutive_frame_sampling}, feed_gt_ray_map=${feed_gt_ray_map}, feed_prev_gt_ray_map=${feed_prev_gt_ray_map})'

# 38633 4292
train_dataset: 38633 @ ${train_data}
test_dataset: 4292 @ ${test_data}

seed: 0
# ===== MULTINODE (8 nodes x 4 GPUs = 32 processes) =====
# Per-GPU batch_size=4, accum_iter=1 -- identical to the gtray/prevpred lr1e5 arms.
batch_size: 4
accum_iter: 1
gradient_checkpointing: True
epochs: 50
start_epoch: 0
weight_decay: 0.05
lr: 1e-5
min_lr: 1e-6
warmup_epochs: 0.5
amp: 1

num_workers: 10
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: True
dist_backend: 'nccl'

# Metric logging / checkpointing
log_median: False        # when False, only *_avg metrics are logged (no *_med)
best_ckpt_agg: avg       # save best checkpoint on loss_avg instead of loss_med

eval_freq: 1
save_freq: 1
keep_freq: 10
print_freq: 10
print_img_freq: 1000
num_imgs_vis: 4
save_dir: '/gpfs/scratch/etur59/koc821022/checkpoints/cut3r_multinode'
exp_name: 'cut3r_finetune_aug_full_prevgt_32gpu_lr1e5'
task: 'cut3r'
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
